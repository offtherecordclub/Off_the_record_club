<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Post</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/post.css" />
  </head>

  <body>
    <header>
      <h1><a href="/html/home.html">OFF THE RECORD CLUB</a></h1>
    </header>

    <div class="post-container">
      <!-- 제목 -->
      <input type="text" id="title" class="title-input" disabled />

      <div class="meta">
        <span id="date"></span>
        <span id="moreBtn" class="more-btn">⋮</span>
      </div>

      <!-- 어두운 배경 -->
      <div id="popupOverlay" class="popup-overlay hidden"></div>

      <!-- 팝업 -->
      <div id="menuPopup" class="menu-popup hidden">
        <button id="deleteBtn">삭제</button>
        <button id="cancelBtn">취소</button>
      </div>

      <hr />

      <!-- 내용 -->
      <div id="content" class="editor"></div>
    </div>

    <div class="comment-section">
      <!-- 흰 박스 -->
      <div class="comment-box">
        <!-- 댓글 리스트 (위) -->
        <div id="commentList" class="comment-list"></div>

        <!-- 댓글 입력창 (아래) -->
        <div class="comment-input">
          <input type="text" id="commentName" placeholder="이름" />
          <textarea id="commentText" placeholder="내용을 입력하세요"></textarea>
          <button id="commentSubmit">등록</button>
        </div>
      </div>
    </div>

    <div class="post-nav">
      <div id="prevPost" class="post-nav-item">이전 글</div>
      <div id="nextPost" class="post-nav-item">다음 글</div>
    </div>

    <script src="/js/post.js"></script>
  </body>
</html>
