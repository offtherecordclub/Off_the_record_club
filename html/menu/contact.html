<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/img/otr.svg" />
    <link rel="stylesheet" type="text/css" href="css/reset.css" />
    <link rel="stylesheet" type="text/css" href="/css/contact.css" />
    <title>Off The Record Club - Contact</title>
  </head>
  <body>
    <header>
      <div class="header-left">
        <a href="/html/menu/work.html" class="menu">Work</a>
        <a href="/html/menu/blog.html" class="menu">Blog</a>
        <a href="/html/menu/about.html" class="menu">About</a>
        <span><a href="/html/menu/contact.html" class="menu">Contact</a></span>
      </div>
      <h1><a href="/html/home.html">OFF THE RECORD CLUB</a></h1>
      <div class="menu-toggle">
        <img src="/img/hamberger menu.svg" alt="햄버거" />
      </div>
    </header>
    <div class="custom-cursor"></div>

    <!-- 햄버거 메뉴 오버레이 및 메뉴 내용 -->
    <div class="mobile-menu-overlay"></div>
    <div class="mobile-menu">
      <div class="close-menu-btn">
        <img src="/img/closed.svg" alt="닫기" />
      </div>
      <a href="/html/menu/work.html">Work</a>
      <a href="/html/menu/blog.html">Blog</a>
      <a href="/html/menu/about.html">About</a>
      <a href="/html/menu/contact.html">Contact</a>
    </div>

    <main class="contact">
      <!-- 상단 인스타/메일 -->
      <div class="contact-info">
        <div class="contact-row">
          <a
            href="https://instagram.com/yoonie_jpg"
            target="_blank"
            class="contact-item"
          >
            <img src="/img/instagram.svg" alt="Instagram" class="icon" />
            <span>@yoonie_jpg</span>
          </a>

          <a
            href="https://instagram.com/offtherecordcluv"
            target="_blank"
            class="contact-item"
          >
            <span>/ @offtherecordcluv</span>
          </a>
        </div>

        <div class="contact-row">
          <a href="mailto:rose06166@naver.com" class="contact-item">
            <img src="/img/email.svg" alt="Email" class="icon" />
            <span>rose06166@naver.com</span>
          </a>
        </div>
      </div>

      <!-- Contact Form (Formspree) -->
      <section class="form-area">
        <h2>Contact Mail</h2>
        <form
          action="https://formspree.io/f/mdkllgkw"
          method="POST"
          enctype="multipart/form-data"
        >
          <label for="subject">제목</label>
          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="제목을 입력해주세요"
            required
          />

          <label for="message">내용</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="내용을 상세히 입력해주세요"
            required
          ></textarea>

          <script>
            const textarea = document.getElementById("message");

            textarea.addEventListener("input", () => {
              textarea.style.height = "100px"; // 초기 높이로 리셋
              textarea.style.height = textarea.scrollHeight + "px"; // 내용 높이에 맞춰 확장
            });
          </script>

          <label for="name">이름 및 소속</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="이름 및 소속에 대해 알려주세요"
          />

          <label for="contact">연락처</label>
          <input
            type="text"
            id="contact"
            name="contact"
            placeholder="소통할 수 있는 연락처 및 이메일을 입력해주세요"
          />

          <button type="submit">문의하기</button>
        </form>
      </section>
    </main>
    <script src="/js/menu.js"></script>
  </body>
</html>
